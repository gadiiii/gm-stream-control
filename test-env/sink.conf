# A stand-in for YouTube or Facebook.
#
# Accepts any publish on any stream key and reports it on /stat. That /stat
# endpoint is the whole point: if a sink shows a live stream, the push leg from
# the origin demonstrably worked end to end.
#
# Note the limitation this implies — there is no on_publish hook, so ANY stream
# key is accepted. A wrong or expired key passes here and fails on the real
# platform. Use `seed.py --mode real` to cover that.

worker_processes 1;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
        }

        # YouTube uses /live2 and Facebook /rtmp, so accept those names too —
        # the sink should not care which platform it is pretending to be.
        application live2 {
            live on;
            record off;
        }

        application rtmp {
            live on;
            record off;
        }

        # A platform that refuses the key. The applications above accept
        # anything, so without this there is no negative case for the
        # key-validation probe to detect.
        #
        # Note how it refuses: nginx-rtmp closes the connection outright rather
        # than returning an RTMP error. Real platforms often do the same, which
        # is why the probe treats "closed right after publish" as a rejection.
        application reject {
            live on;
            record off;
            on_publish http://127.0.0.1:8080/deny;
        }
    }
}

http {
    server {
        listen 8080;

        location /stat {
            rtmp_stat all;
            add_header Access-Control-Allow-Origin *;
        }

        location /deny {
            return 403;
        }
    }
}
