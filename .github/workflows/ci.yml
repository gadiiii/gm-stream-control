name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # `npm run lint` is a no-op today — eslint isn't a declared dependency
      # (package.json references it, but it's absent from package-lock.json).
      # Re-add this once that's fixed: `npm run lint`.
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # lib/supabase.ts calls createClient() eagerly at module scope, which
          # throws on an empty URL — and that module gets pulled into the
          # prerendered /_not-found page. These are placeholders only; the
          # build never actually contacts Supabase.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

  backend:
    name: Backend (import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py
      # Sanity import — catches syntax/import errors without needing live
      # Supabase/DB credentials (main.py degrades gracefully when unset).
      - run: python -c "import main"
